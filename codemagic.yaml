workflows:
  ios-unsigned:
    name: hotdogdot iOS - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      node: 24.15.0
      xcode: 26.4
      cocoapods: default
      vars:
        APP_NAME: "hotdogdot"

    cache:
      cache_paths:
        - ~/.npm
        - ~/.cargo/registry
        - ~/.cargo/git
        - src-tauri/target

    scripts:
      - name: Show build environment
        script: |
          set -e
          node --version
          npm --version
          xcodebuild -version
          pod --version || true

      - name: Install JavaScript dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          npm ci

      - name: Install Rust iOS target
        script: |
          set -e
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi

          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustc --version
          cargo --version

      - name: Typecheck and build frontend
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          npm run build

      - name: Prepare iOS native tools
        script: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # cargo-mobile/Tauri checks for idevicesyslog when detecting
          # libimobiledevice. Codemagic can already have the formula installed
          # but not linked, so relink first instead of doing a costly reinstall.
          if ! command -v idevicesyslog >/dev/null 2>&1; then
            if brew list --versions libimobiledevice >/dev/null 2>&1; then
              brew link --overwrite --force libimobiledevice || true
              hash -r
            fi
          fi

          if ! command -v idevicesyslog >/dev/null 2>&1; then
            brew install libimobiledevice
            brew link --overwrite --force libimobiledevice || true
            hash -r
          fi

          # Same strategy for XcodeGen: use the existing Cellar install first.
          if ! command -v xcodegen >/dev/null 2>&1; then
            if brew list --versions xcodegen >/dev/null 2>&1; then
              brew link --overwrite --force xcodegen || true
              hash -r
            fi
          fi

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
            hash -r
          fi

          echo "Resolved native iOS tools:"
          command -v idevicesyslog
          command -v idevice_id
          command -v xcodegen
          command -v pod
          xcodegen --version
          pod --version

      - name: Generate Tauri iOS project
        script: |
          set -e
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          cd "$CM_BUILD_DIR"
          cargo --version
          rustc --version
          command -v idevicesyslog
          command -v idevice_id
          command -v xcodegen
          rm -rf src-tauri/gen/apple
          npx tauri ios init --ci
          test -d src-tauri/gen/apple
          find src-tauri/gen/apple -maxdepth 2 -type d -name "*.xcodeproj" -print

      - name: Build unsigned iOS app with Tauri
        script: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CI=true
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          cd "$CM_BUILD_DIR"

          # IMPORTANT: do not call xcodebuild directly here.
          # The generated Xcode build phase calls `tauri ios xcode-script`
          # and expects a temporary server-addr file created by the parent
          # Tauri CLI process. Direct xcodebuild skips that setup.
          npx tauri ios build --ci --target aarch64 --no-sign -v

      - name: Collect unsigned IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR"

          FOUND_IPA="$(find "$CM_BUILD_DIR/src-tauri/gen/apple" -type f -name '*.ipa' -print -quit || true)"

          if [ -n "$FOUND_IPA" ] && [ -f "$FOUND_IPA" ]; then
            cp "$FOUND_IPA" "$IPA_DIR/$APP_NAME-unsigned.ipa"
          else
            echo "Tauri did not expose an IPA directly; looking for the built device app."
            APP_PATH="$(find "$CM_BUILD_DIR/src-tauri/gen/apple" "$CM_BUILD_DIR/src-tauri/target" \
              -type d -name '*.app' -path '*iphoneos*' -print -quit 2>/dev/null || true)"

            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              APP_PATH="$(find "$CM_BUILD_DIR/src-tauri/gen/apple" \
                -type d -name '*.app' -print -quit 2>/dev/null || true)"
            fi

            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              echo "ERROR: No unsigned IPA or iPhone .app was produced."
              echo "Available Apple build outputs:"
              find "$CM_BUILD_DIR/src-tauri/gen/apple" -maxdepth 6 \
                \( -name '*.ipa' -o -name '*.app' -o -name '*.xcarchive' \) -print || true
              exit 1
            fi

            TMP_PAYLOAD="$IPA_DIR/Payload"
            rm -rf "$TMP_PAYLOAD"
            mkdir -p "$TMP_PAYLOAD"
            cp -R "$APP_PATH" "$TMP_PAYLOAD/"
            (
              cd "$IPA_DIR"
              /usr/bin/zip -qry "$APP_NAME-unsigned.ipa" Payload
            )
            rm -rf "$TMP_PAYLOAD"
          fi

          echo "Unsigned IPA ready:"
          ls -lh "$IPA_DIR/$APP_NAME-unsigned.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - src-tauri/gen/apple/**/*.xcarchive
      - src-tauri/gen/apple/**/*.app
