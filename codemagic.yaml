workflows:
  ios-unsigned:
    name: hotdogdot iOS - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      node: 22
      xcode: 26.4
      cocoapods: default
      vars:
        APP_NAME: hotdogdot

    cache:
      cache_paths:
        - ~/.npm
        - ~/.cargo/registry
        - ~/.cargo/git
        - src-tauri/target

    scripts:
      - name: Show build environment
        script: |
          set -euo pipefail
          node --version
          npm --version
          xcodebuild -version
          pod --version

      - name: Install dependencies and validate frontend
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          npm ci
          npm run typecheck
          npm run build

      - name: Prepare Rust and iOS tools
        script: |
          set -euo pipefail
          [ ! -f "$HOME/.cargo/env" ] || source "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          rustup default stable
          rustup target add aarch64-apple-ios

          for package in xcodegen libimobiledevice; do
            if ! brew list --versions "$package" >/dev/null 2>&1; then
              brew install "$package"
            fi
            brew link --overwrite --force "$package" >/dev/null 2>&1 || true
          done
          hash -r

          rustc --version
          cargo --version
          command -v xcodegen
          command -v idevice_id
          xcodegen --version

      - name: Generate Tauri iOS project
        script: |
          set -euo pipefail
          [ ! -f "$HOME/.cargo/env" ] || source "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$CM_BUILD_DIR"

          rm -rf src-tauri/gen/apple
          npx tauri ios init --ci

          PROJECT_YML="src-tauri/gen/apple/project.yml"
          test -f "$PROJECT_YML"
          grep -Fq 'LD_RUNPATH_SEARCH_PATHS: [$(inherited), "@executable_path/Frameworks", /usr/lib/swift]' "$PROJECT_YML"
          grep -Fq 'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true' "$PROJECT_YML"
          grep -Fq 'SWIFT_VERSION: 5.9' "$PROJECT_YML"
          find src-tauri/gen/apple -maxdepth 2 -type d -name '*.xcodeproj' -print -quit | grep -q .

      - name: Build unsigned Release IPA with Tauri
        script: |
          set -euo pipefail
          [ ! -f "$HOME/.cargo/env" ] || source "$HOME/.cargo/env"
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CI=true
          cd "$CM_BUILD_DIR"

          PROJECT="$(find src-tauri/gen/apple -maxdepth 2 -type d -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          RELEASE_SETTINGS="$(xcodebuild -project "$PROJECT" -scheme hotdogdot_iOS -configuration release -showBuildSettings)"
          grep -Fq 'CONFIGURATION = release' <<<"$RELEASE_SETTINGS"
          if grep -Fq 'SWIFT_OPTIMIZATION_LEVEL = -Onone' <<<"$RELEASE_SETTINGS"; then
            echo 'ERROR: release configuration uses debug Swift optimization' >&2
            exit 1
          fi

          npx tauri ios build --ci --target aarch64 --no-sign -v 2>&1 | tee build-ios.log

      - name: Collect unsigned IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR"

          FOUND_IPA="$(find src-tauri/target src-tauri/gen/apple -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$FOUND_IPA" ]; then
            echo 'ERROR: Tauri did not produce an unsigned IPA.' >&2
            find src-tauri/target src-tauri/gen/apple -maxdepth 8 \( -name '*.ipa' -o -name '*.app' -o -name '*.xcarchive' \) -print 2>/dev/null || true
            exit 1
          fi

          OUTPUT_IPA="$IPA_DIR/$APP_NAME-unsigned.ipa"
          cp "$FOUND_IPA" "$OUTPUT_IPA"

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$OUTPUT_IPA" -d "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          /usr/bin/otool -l "$APP_PATH/$EXECUTABLE" > "$VERIFY_DIR/otool.txt"
          grep -F '/usr/lib/swift' "$VERIFY_DIR/otool.txt" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP_PATH/Info.plist" > "$VERIFY_DIR/background-modes.txt"
          grep -Fx '    audio' "$VERIFY_DIR/background-modes.txt" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTXcodeBuild' "$APP_PATH/Info.plist")" != ""
          ls -lh "$OUTPUT_IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - build-ios.log
      - src-tauri/gen/apple/**/*.xcarchive
