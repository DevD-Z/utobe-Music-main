server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD:hotdogdot-local-lavalink}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    oauth:
      enabled: "${YOUTUBE_OAUTH_ENABLED:false}"
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: "${YOUTUBE_OAUTH_SKIP_INITIALIZATION:true}"
    clients:
      # TV is the only playback client here that uses the configured OAuth token.
      # IOS yields AVPlayer-compatible audio; MUSIC remains search-only.
      - TV
      - IOS
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - MUSIC

logging:
  level:
    root: INFO
    lavalink: INFO
