<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body,#p{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style>
<script>
// Background video playback support for iOS WebKit (adapted from Brave & Mozilla video-bg-play)
(function() {
  'use strict';
  try {
    Object.defineProperty(Document.prototype, 'hidden', { get: function() { return false; }, configurable: true });
    Object.defineProperty(Document.prototype, 'visibilityState', { get: function() { return 'visible'; }, configurable: true });
    Object.defineProperty(Document.prototype, 'onvisibilitychange', { get: function() { return null; }, set: function() {}, configurable: true });
  } catch(e) {}

  var nativePlay = null, pauseRequested = false;
  try {
    if (window.HTMLMediaElement && HTMLMediaElement.prototype) {
      nativePlay = HTMLMediaElement.prototype.play;
      var nativePause = HTMLMediaElement.prototype.pause;
      HTMLMediaElement.prototype.pause = function() {
        pauseRequested = true;
        return nativePause.apply(this, arguments);
      };
      HTMLMediaElement.prototype.play = function() {
        pauseRequested = false;
        return nativePlay.apply(this, arguments);
      };
    }
  } catch(e) {}

  var nativeVisGet = null;
  try {
    var desc = Object.getOwnPropertyDescriptor(Document.prototype, 'visibilityState');
    if (desc && desc.get) nativeVisGet = desc.get;
  } catch(e) {}
  function realVis() {
    try { if (nativeVisGet) return nativeVisGet.call(document); } catch(e) {}
    return 'visible';
  }

  var REPLAY_MS = 2500, lastHidden = -REPLAY_MS, lastVisible = -REPLAY_MS;
  document.addEventListener('visibilitychange', function() {
    if (realVis() === 'hidden') lastHidden = Date.now(); else lastVisible = Date.now();
  }, true);

  function replay(v) {
    try {
      var r = nativePlay ? nativePlay.call(v) : v.play();
      if (r && typeof r.catch === 'function') r.catch(function() {});
    } catch(e) {}
  }

  document.addEventListener('pause', function(e) {
    var v = e.target;
    if (!v || !v.tagName || (v.tagName !== 'VIDEO' && v.tagName !== 'AUDIO')) return;
    if (pauseRequested || v.ended) return;
    var now = Date.now();
    if (realVis() === 'hidden') {
      if (now - lastHidden < REPLAY_MS) replay(v);
      return;
    }
    if (now - lastVisible < REPLAY_MS) {
      replay(v);
      return;
    }
  }, true);
})();
</script>
</head>
<body>
<div id="p"></div>
<script>
var player, ready = false, queued = [];
var isIntentionallyPlaying = false;

function send(msg) { parent.postMessage(Object.assign({ source: 'hd-yt-relay' }, msg), '*'); }

function run(m) {
  if (!ready) { queued.push(m); return; }
  if (m.cmd === 'load') {
    isIntentionallyPlaying = true;
    player.loadVideoById({ videoId: m.id, startSeconds: m.start || 0 });
  } else if (m.cmd === 'cue') {
    isIntentionallyPlaying = false;
    player.cueVideoById({ videoId: m.id, startSeconds: m.start || 0 });
  } else if (m.cmd === 'play') {
    isIntentionallyPlaying = true;
    player.playVideo();
  } else if (m.cmd === 'pause') {
    isIntentionallyPlaying = false;
    player.pauseVideo();
  } else if (m.cmd === 'seek') {
    player.seekTo(m.time, true);
  } else if (m.cmd === 'volume') {
    player.setVolume(m.value);
  } else if (m.cmd === 'mute') {
    player.mute();
  } else if (m.cmd === 'unmute') {
    player.unMute();
  }
}

window.addEventListener('message', function (e) {
  if (e.source !== parent || !e.data || e.data.target !== 'hd-yt-relay') return;
  run(e.data);
});

function onYouTubeIframeAPIReady() {
  player = new YT.Player('p', {
    width: '100%', height: '100%',
    playerVars: {
      autoplay: 1,
      playsinline: 1,
      controls: 0,
      disablekb: 1,
      fs: 0,
      rel: 0,
      iv_load_policy: 3
    },
    events: {
      onReady: function () {
        ready = true;
        send({ event: 'ready' });
        queued.splice(0).forEach(run);
      },
      onStateChange: function (e) {
        if (e.data === 2 && isIntentionallyPlaying) {
          setTimeout(function() {
            if (isIntentionallyPlaying && player && typeof player.playVideo === 'function') {
              player.playVideo();
            }
          }, 100);
        }
        send({ event: 'state', data: e.data });
      },
      onError: function (e) {
        send({ event: 'error', data: e.data });
      }
    }
  });

  setInterval(function () {
    if (!ready || typeof player.getCurrentTime !== 'function') return;
    send({
      event: 'time',
      time: player.getCurrentTime() || 0,
      duration: player.getDuration() || 0,
      state: player.getPlayerState()
    });
  }, 400);
}

var s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);
</script>
</body>
</html>
